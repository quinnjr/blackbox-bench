name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest coverage
      - name: Build & install pybench
        # `pip install -e .` uses maturin as the PEP 517 build backend (see
        # pyproject.toml [build-system]); unlike `maturin develop`, this works
        # without an active virtualenv, which setup-python doesn't provide.
        run: python -m pip install -e .
      - name: Cargo unit tests
        run: cargo test --lib
      - name: Pytest
        run: python -m pytest -v
