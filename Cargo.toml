[package]
name = "pybench"
version = "1.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Lightweight Python microbenchmarking library — Rust core"

[lib]
name = "_pybench"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
hdrhistogram = "7"
fastrand = "2"

[profile.release]
lto = "thin"
codegen-units = 1
