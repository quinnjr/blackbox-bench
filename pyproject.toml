[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "blackbox-bench"
version = "1.0.0"
description = "Lightweight Python microbenchmarking library with Rust core (PyO3)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joseph R Quinn", email = "quinnjr@proton.me" }]
keywords = ["benchmark", "benchmarking", "performance", "profiling", "timing", "rust", "pyo3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/quinnjr/blackbox-bench"
Repository = "https://github.com/quinnjr/blackbox-bench"
Issues = "https://github.com/quinnjr/blackbox-bench/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "coverage>=7.0", "maturin>=1.5"]
profile = ["py-spy>=0.3"]

[project.scripts]
blackbox-bench = "blackbox_bench.cli:main"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "blackbox_bench._blackbox_bench"

[tool.pytest.ini_options]
testpaths = ["tests"]
